<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 334 300" width="334" height="300" role="img" aria-label="优惠券">
  <defs>
    <linearGradient id="cpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5C5C"/>
      <stop offset="0.5" stop-color="#F64747"/>
      <stop offset="1" stop-color="#E23A3A"/>
    </linearGradient>
    <linearGradient id="cpGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="cpNotch">
      <rect width="334" height="300" fill="#FFFFFF"/>
      <circle cx="0" cy="34.5" r="15" fill="#000000"/>
      <circle cx="0" cy="80.5" r="15" fill="#000000"/>
      <circle cx="0" cy="126.5" r="15" fill="#000000"/>
      <circle cx="0" cy="172.5" r="15" fill="#000000"/>
      <circle cx="0" cy="218.5" r="15" fill="#000000"/>
      <circle cx="0" cy="264.5" r="15" fill="#000000"/>
    </mask>
  </defs>
  <g mask="url(#cpNotch)">
    <rect width="334" height="300" fill="url(#cpBg)"/>
    <rect width="334" height="300" fill="url(#cpGlow)"/>
  </g>
</svg>
